<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Player OBS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <audio id="audio" autoplay></audio>

  <script>
    const audio = document.getElementById("audio");
    let isPlaying = false;

    async function checkNextAudio() {
      if (isPlaying) return;

      try {
        const res = await fetch("/next-audio");
        const data = await res.json();

        if (data.file) {
          isPlaying = true;

          audio.src = "/uploads/" + data.file;
          audio.volume = 1.0;

          try {
            await audio.play();
            console.log("Reproduciendo:", data.file);
          } catch (err) {
            console.error("Error reproduciendo audio:", err);
            isPlaying = false;
          }
        }
      } catch (error) {
        console.error("Error buscando audio:", error);
      }
    }

    audio.addEventListener("ended", () => {
      isPlaying = false;
      setTimeout(checkNextAudio, 300);
    });

    audio.addEventListener("error", (e) => {
      console.error("Error en el elemento audio:", e);
      isPlaying = false;
    });

    setInterval(checkNextAudio, 1500);
  </script>
</body>
</html>
