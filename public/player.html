<!DOCTYPE html>
<html>
<head>
  <title>Audio Player</title>
</head>
<body>
<script>
let isPlaying = false;

async function checkAudio() {
  try {
    const res = await fetch("/next-audio");
    const data = await res.json();

    if (data.file && !isPlaying) {
      isPlaying = true;

      const audio = new Audio("/storage/uploads/" + data.file);

      audio.volume = 1.0;

      audio.play().then(() => {
        console.log("Reproduciendo:", data.file);
      }).catch(err => {
        console.error("Error reproduciendo:", err);
      });

      audio.onended = () => {
        isPlaying = false;
      };
    }
  } catch (e) {
    console.error("Error fetching audio:", e);
  }
}

// comprobar cada 2 segundos
setInterval(checkAudio, 2000);
</script>
</body>
</html>
