<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>OBS Audio Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      z-index: 9999;
      background: transparent;
    }

    #overlay video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent !important;
      opacity: 0;
      transition: opacity 0.08s linear;
    }
  </style>
</head>
<body>
  <audio id="audio" autoplay></audio>

  <div id="overlay">
    <video id="anim" muted playsinline preload="auto">
      <source src="/animacion.webm" type="video/webm">
    </video>
  </div>

  <script>
    const audio = document.getElementById("audio");
    const overlay = document.getElementById("overlay");
    const anim = document.getElementById("anim");

    let isPlaying = false;

    function showOverlayContainer() {
      overlay.style.display = "block";
    }

    function hideOverlayCompletely() {
      overlay.style.display = "none";
      anim.style.opacity = "0";
      anim.pause();
      // reset suave, ya oculto para evitar frame negro
      try {
        anim.currentTime = 0;
      } catch {}
    }

    function startAnimation() {
      showOverlayContainer();
      anim.style.opacity = "0";
      anim.pause();

      try {
        anim.currentTime = 0;
      } catch {}

      anim.play().catch(err => {
        console.error("Error animación:", err);
      });
    }

    async function checkNextAudio() {
      if (isPlaying) return;

      try {
        const res = await fetch("/next-audio");
        const data = await res.json();

        if (!data.file) return;

        isPlaying = true;
        audio.src = "/uploads/" + data.file;
        audio.volume = 1.0;

        startAnimation();

        try {
          await audio.play();
        } catch (err) {
          setTimeout(() => {
            audio.play().catch(() => {});
          }, 500);
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Solo mostramos la animación cuando el video YA está reproduciendo
    anim.addEventListener("playing", () => {
      anim.style.opacity = "1";
    });

    // Si termina la animación antes que el audio, la dejamos visible en el último frame bueno
    anim.addEventListener("ended", () => {
      anim.pause();
    });

    audio.addEventListener("ended", () => {
      isPlaying = false;
      hideOverlayCompletely();
      setTimeout(checkNextAudio, 300);
    });

    audio.addEventListener("error", () => {
      isPlaying = false;
      hideOverlayCompletely();
    });

    setInterval(checkNextAudio, 1500);
  </script>
</body>
</html>
