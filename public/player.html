<!DOCTYPE html>
<html>
<head>
  <title>OBS Audio Player</title>
</head>
<body>
  <audio id="audio" autoplay></audio>

  <script>
    const audio = document.getElementById("audio");
    let isPlaying = false;

    async function checkNextAudio() {
      if (isPlaying) return;

      try {
        const res = await fetch("/next-audio");
        const data = await res.json();

        if (!data.file) return;

        isPlaying = true;
        audio.src = "/uploads/" + data.file;
        audio.volume = 1.0;

        try {
          await audio.play();
        } catch (err) {
          setTimeout(() => {
            audio.play().catch(() => {});
          }, 500);
        }
      } catch (err) {
        console.error(err);
      }
    }

    audio.addEventListener("ended", () => {
      isPlaying = false;
      setTimeout(checkNextAudio, 300);
    });

    audio.addEventListener("error", () => {
      isPlaying = false;
    });

    setInterval(checkNextAudio, 1500);
  </script>
</body>
</html>
